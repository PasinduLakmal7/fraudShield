services:
  # =============================================================================
  # Infrastructure
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/supabase/bootstrap:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudshield-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fraudshield-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fraudshield}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-fraudshield_dev_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudshield-network

  redis:
    image: redis:7-alpine
    container_name: fraudshield-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fraudshield-network

  # =============================================================================
  # Backend Services
  # =============================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: gateway/FraudShield.ApiGateway/Dockerfile
    container_name: fraudshield-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5000:8080"
    depends_on:
      - identity-service
      - customer-service
      - transaction-service
      - fraud-service
      - alert-service
    networks:
      - fraudshield-network

  identity-service:
    build:
      context: ./backend
      dockerfile: services/IdentityService/Identity.API/Dockerfile
    container_name: fraudshield-identity
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fraudshield_identity;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password}
      - RabbitMQ__Host=rabbitmq
      - Redis__ConnectionString=redis:6379
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudshield-network

  customer-service:
    build:
      context: ./backend
      dockerfile: services/CustomerService/Customer.API/Dockerfile
    container_name: fraudshield-customer
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fraudshield_customer;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password}
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5102:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudshield-network

  transaction-service:
    build:
      context: ./backend
      dockerfile: services/TransactionService/Transaction.API/Dockerfile
    container_name: fraudshield-transaction
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fraudshield_transaction;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password}
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5103:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudshield-network

  fraud-service:
    build:
      context: ./backend
      dockerfile: services/FraudDetectionService/Fraud.API/Dockerfile
    container_name: fraudshield-fraud
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fraudshield_fraud;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password}
      - RabbitMQ__Host=rabbitmq
      - Redis__ConnectionString=redis:6379
    ports:
      - "5104:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fraudshield-network

  alert-service:
    build:
      context: ./backend
      dockerfile: services/AlertService/Alert.API/Dockerfile
    container_name: fraudshield-alert
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fraudshield_alert;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_password}
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5105:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudshield-network

  notification-service:
    build:
      context: ./backend
      dockerfile: services/NotificationService/Notification.Worker/Dockerfile
    container_name: fraudshield-notification
    environment:
      - DOTNET_ENVIRONMENT=Docker
      - RabbitMQ__Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fraudshield-network

  # =============================================================================
  # Frontend Dashboard
  # =============================================================================
  dashboard:
    build:
      context: ./frontend/fraudshield-dashboard
      dockerfile: Dockerfile
    container_name: fraudshield-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - fraudshield-network

networks:
  fraudshield-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
